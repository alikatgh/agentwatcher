name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch and verify embedded Zed source
        run: python3 tools/setup_zed_engine.py --fetch
      - name: Test Rust
        run: cargo +1.98.1 test --locked -j 2
      - name: Build Rust and GPUI app
        env:
          AW_OUTPUT_DIR: dist/rust-release
        run: bash build-rust.sh
      - name: Create release with the Rust app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/rust-release/AgentWatcher-0.2.0-macos.zip" "dist/rust-release/AgentWatcher-0.2.0-source.tar.gz" \
            --title "AgentWatcher $GITHUB_REF_NAME" \
            --notes "Built automatically by GitHub Actions from commit $GITHUB_SHA."
